# ai_draw_plugin 配置文件
# AI 绘图插件，命令前缀 /ad

[plugin]
enabled = true
config_version = "2.4.2"
send_mode = "direct"
force_forward_when_nsfw_off = true
use_http_direct = false
napcat_http_url = "http://127.0.0.1:5780"
napcat_http_token = ""
y_apply_artist_preset = false

[admin]
admin_users = []
default_admin_mode = false

[prompt_generator]
model_name = "deepseek-v4-pro"
api_base = "https://api.deepseek.com"
api_key = ""
output_format = "json"
selfie_appearance_policy = "auto"
enforce_tag_order = false
scene_llm_enabled = true
temperature = 0.2
max_tokens = 4000
prompt_template = ""
inherit_ttl = 3600

[auto_recall]
enabled = true
delay_seconds = 50
allowed_groups = []

[nsfw_filter]
enabled = true
filter_tags = "{{{{{nsfw}}}}}"

[prompt_show]
enabled = false
hide_selfie_prompt_add = false
selfie_prompt_add = ""
negative_prompt_add = ""

selfie_ref_image = ""

# 全局风格预设（画师串）；模型里用 artist_preset = "名称" 引用

[artist_presets]
[[artist_presets.presets]]
name = "无"
prompt = ""

[[artist_presets.presets]]
name = "梦幻柔美3.0"
prompt = "1.25::artist:ATEOYH::, 0.95::artist:nekoume::, 0.90::artist:fuumi (radial_engine)::, 0.80::artist:aya_shobon::, 0.75::artist:lino_chang::, 0.70::artist:bae.c::, 0.40::artist:num_s1x::, 0.30::artist:nababa::, "

[[artist_presets.presets]]
name = "本子风格"
prompt = "artist:kedama milk,artist:satou kuuki,artist:kz oji,artist:croriin,masterpiece,best quality,"

[styles]
[[styles.presets]]
name = "BGD质感"
prompt = "BJD texture, top-down shot, delicate skin texture, added blue noise, dark background, natural soft light highlights, 8K ultra HD, cinematic lighting, detail sharpening, transparent texture"

[random_scene]
temperature = 1.0
max_tokens = 200

[queue]
enabled = false
max_concurrent = 2
max_concurrent_per_session = 1
max_queued = 20
per_session_limit = 3
history_ttl = 300

[custom_prompt]
system_prompt = ""

